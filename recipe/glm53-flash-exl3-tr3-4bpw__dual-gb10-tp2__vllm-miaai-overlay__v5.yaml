    method: "EXL3/TR3 trellis, uniform-K4 4bpw, MCG codebook — ROUTED-EXPERT MLPs ONLY. Dense MLPs, attention, shared experts, routing, embeddings and lm_head stay native BF16, served as FP8 weight-only via Marlin on the dense+kda groups (GLM53_DENSE_FP8=dense,kda, unchanged from v3)."
    producible_by_upstream_quantize: false
    quant_repo: "brandonmusic/GLM-5.3-Flash-tr3-4bpw @ 5ab363a8 (mirrored byte-identical as Mia-AiLab/…@25a44fdb)"
    variant: "uniform-K4; encoder reproducibility bundle shipped in the origin repo"
    file_size_gb: 163.6
    mixed_precision:
      is_mixed: true
      scheme: "EXL3 4bpw on routed-expert MLPs; BF16 everything else (dense FP8 at load, not on disk)."

