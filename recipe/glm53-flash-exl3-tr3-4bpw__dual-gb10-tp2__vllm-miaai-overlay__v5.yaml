# =============================================================================
# RECIPE v5 — GLM-5.3-Flash EXL3/TR3 4bpw on two GB10 nodes, TP=2, MiaAI overlay RE-VENDORED at
# 0f49cfd (IP-327, 2026-09-24) and BUILT LOCALLY. Differences from v3: upstream's TP=2 opt-ins
# GLM53_EXL3_MOE_FAST (thin-decode routed-expert kernels), GLM53_DRAFT_KV_COMPACT (drafter pages
# aligned to the Mamba block) and GLM53_SPINWAIT_MS=16; the always-on Mamba align fixes; upstream's
# vision OOM caps (48 images x 2048 tokens, 1 GiB processor cache); DEFAULT_MAX_NEW_TOKENS 65536 for
# omitted limits; tool_choice "none" enforced at decode. GLM53_KDA_BF16_LARGE_M stays OFF (measured: +9-10%
# prefill, but its 3.29 GiB/rank does not fit 12 sequences + vision on the head). Image cap 8 per request (measured).
# Every number is MEASURED in the IP-327 results record (results_refs) against a same-day v3 control.
# v4 = IP-314's rejected candidate; v3 stays as rollback.
# =============================================================================

schema_version: "1.0"
recipe_id: glm53-flash-exl3-tr3-4bpw__dual-gb10-tp2__vllm-miaai-overlay__v5

meta:
  name: "GLM-5.3-Flash EXL3/TR3 4bpw on two RDMA-linked GB10 nodes — MiaAI overlay 0f49cfd (local build), TP=2, thin-decode MoE kernels, compact DFlash2 pages, spin-wait 16 ms, DFlash2 k=7 with adaptive verification (margin 2.0), pinned 13.5 GiB fp8 KV, FP8 dense projections, runtime abliteration, vision OOM caps"
  created: "2026-09-24"
  author: "fleet agent (IP-327 upstream opt-in adoption, David-directed; v3 by IP-310)"
  status: production   # promoted by David 2026-09-24 ("That's great. I'll sign off on that.")
  intended_use:
    - reasoning-heavy
    - tool-calling-agent
    - long-context-retrieval
  one_line_tradeoff: >-
    MEASURED 2026-09-24 against a same-day v3 control (IP-327, results_refs): decode +7.7% single-stream
    structured (79.1 vs 73.5 tok/s, same acceptance), +8.8% code, +6-7% prose, +7.4% at c12 (357 vs 332);
    cold prefill +2-6%; a 28.7k-token repeat prefix answers in 0.43 s instead of 3.9 s (all 8 pages reused);
    EngineCore CPU 18% of a core instead of 100%; the same 13.5 GiB pin holds 1.42M tokens (2.22x at 640k)
    instead of 721k; worst-case head floor under 3x250k 4.66 GiB (v3 4.07). Costs: at most 8 images per
    request (v3 allowed 100 with no token cap; 8 x 2048-token images leave the head at 3.29 GiB) and
    omitted max_tokens now defaults to 65,536. Correctness unchanged: needles exact, 11/11 stress needles,
    ablit 8/8, thinking-off stories 3/4, LCB thinking-off 2/3 (v3 0/3).
  source:
    url: "https://huggingface.co/Mia-AiLab/GLM-5.3-Flash-EXL3-TR3-4bpw"
    author: "quant by brandonmusic (EXL3/TR3); serving recipe by MiaAI-Lab; base zai-org/GLM-5.3-Flash"
    retrieved: "2026-09-01"
    modifications: >-
      None to the checkpoint (revision 25a44fdb, unchanged since v1; artifacts re-verified 2026-09-24).
      Engine: MiaAI-Lab/GLM-5.3-Flash-EXL3-2x-DGX-Sparks vendored at 0f49cfd (2026-09-23; was f906ee99)
      in models/runtimes/dual-spark-cluster/glm53-flash-exl3/miaai-overlay/ with RUIN-DELTAS §1 (dual-rail
      NCCL env) and §3 (bench harness port/name on the live tree). Chat template = the overlay file,
      byte-identical to v3's (sha256 7a5a0dda…). Transplant set hardlinked into the live tree (RUIN-DELTAS §5).
  tags: [dgx-spark, gb10, sm121, exl3, trellis, tr3, 4bpw, moe, glm5, glm53, flash, tensor-parallel, rdma, dflash2, speculative, adaptive-k, e3-grouped-moe, thin-decode-moe, draft-kv-compact, fp8-kv, kv-pinned, abliteration-toggle, vision-caps, local-build, evaluation]

model:
  id: "Mia-AiLab/GLM-5.3-Flash-EXL3-TR3-4bpw"
  architecture: moe
  total_params_b: 320.0
  active_params_b: 18.0
  moe: { num_experts: 288, experts_per_token: 8 }
  attention:
    type: hybrid                     # 34 KDA linear + 11 NoPE sparse-MLA (DSA)
    kv_heads: 64
    head_dim: 128
    notes: "NoPE MLA (qk_rope_head_dim=0, kv_lora_rank=512); KDA state is fixed-size recurrent, not per-token KV. Unchanged from v3."
  native_precision: bf16
  native_context_tokens: 1048576
  reasoning_mode: { supported: true, mechanism: think-tags }
  builtin_speculative_weights: { present: true, kind: mtp }   # checkpoint MTP head present; the EXTERNAL DFlash2 drafter is served instead
  license: "shapleymcg-1.0 (custom — REVIEW BEFORE REDISTRIBUTING ANYTHING DERIVED). DFlash2 drafter is separately CC-BY-NC-ND-4.0: internal eval only."

quantization:
