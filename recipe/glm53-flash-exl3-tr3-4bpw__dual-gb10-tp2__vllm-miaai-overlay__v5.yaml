notes: >-
  IP-327 (2026-09-24): arm A = v3 re-booted as a same-day control; arm B = this configuration with image cap 48
  (all speed and correctness gates PASS; vision measured safe to 8); arm C' = B + KDA BF16 large-M + 8 GiB pin
  (rejected on c12). The final boot on :8000 is B with LIMIT_MM image 8. v4 = IP-314's rejected candidate.
  Rollback = v3: ~/safe-takedown.sh --peer <worker-host>, then boot ~/glm53-exl3-overlay-f906ee99 on :8000.
